<script>
//CORE
const norm=s=>s.replace(/[İıI]/g,'i').toLowerCase(),esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const OK={'geçici':'gecici','ek':'ek','mükerrer':'mukerrer'},AL='A-Za-zçğıöşüÇĞİÖŞÜ';
const head=l=>{const n=norm(l.replace(/^[\s#*]+/,'')),m=n.match(/^((?:(?:geçici|ek|mükerrer)\s+)*)madde[\s:\-–—]*(\d+(?:\/[a-zçğıöşü]+)?)/);
 if(!m||!/^\s*(?:[-–—:.*]|$)/.test(n.slice(m[0].length)))return null;
 return m[1].trim().split(/\s+/).filter(Boolean).map(x=>OK[x]).join('')+m[2]};
const son=l=>/^\[\^?\d+\]:/.test(l.trim())||/^(?:\d+\s+sayili\s+kanuna\s+(?:ek|işlenemeyen)|işlenemeyen\s+hükümler|kanuna\s+ek\s+ve\s+değişiklik|ek\s+ve\s+değişiklik\s+getiren|yürürlüğe\s+giriş\s+tarih)/.test(norm(l.replace(/^[\s#*]+/,'')));
const TL=l=>{l=l.replace(/\*\*/g,'').replace(/(?:\s*\[\^?\d+\])+$/,'').trim();return!!l&&l.length<=140&&!/[.;:!?]$/.test(l)&&!/^\((?:Ek|Değişik|Mülga|İptal|Yeniden|Başlığı)/.test(l)&&!/^\(?\d+\)/.test(l)&&!new RegExp('^['+AL+']\\)').test(l)&&!/^\[\^?\d+\]:/.test(l)&&!/^(?:Kanun\s+Numaras|Kabul\s+Tarihi|Yayımland|Tertip|Dayandığı)/i.test(l)};
const clean=l=>l.replace(/\*\*/g,'').replace(/^#+\s*/,'').replace(/\\([^\w\s])/g,'$1').replace(/\s*\[\^?\d+\]/g,'').trim();
function tail(lines){const h=[];while(lines.length){const l=lines[lines.length-1].trim();if(!l){lines.pop();continue}if(TL(l)){h.unshift(clean(l));lines.pop()}else break}return h}
const UN=/^(?:\S+\s+){0,3}(?:kitap|kisim|bap|bab|bölüm|fasil|ayirim)\b/;
function prep(md){
 md=md.replace(/\r/g,'').replace(/\\\[(\d+)\\\]/g,'[$1]').replace(/\\[ \t]*\n/g,'\n')
  .replace(new RegExp('(^[ \\t]*(?:#+[ \\t]*)?\\**(?:['+AL+']+[ \\t]+)*madde\\**)(?:[ \\t]*\\n)+[ \\t]*\\**(\\d+(?:\\/['+AL+']+)?[ \\t]*[-–—:.*])','gmi'),'$1 $2');
 return md}
function parse(md){md=prep(md);
 const L=md.split('\n'),fn={},arts=[];let end=L.length;
 for(let i=0;i<L.length;i++)if(son(L[i])){end=i;break}
 Object.assign(fn,fnParse(L,end));
 let c=null;
 for(let i=0;i<end;i++){const l=L[i],k=head(l);
  if(k){const h=c?tail(c.lines):(()=>{const b=L.slice(Math.max(0,i-8),i);return tail(b)})();
   let t='',sec=h;if(h.length&&!UN.test(norm(h[h.length-1]))&&!/^[IVXLCDM]+\s*[-–—.]/.test(h[h.length-1])){t=h[h.length-1];sec=h.slice(0,-1)}
   c={k,title:t,sec:mergeSec(sec),lines:[],hr:l};arts.push(c);
   const rest=l.replace(/^[\s#*]+/,'').replace(new RegExp('^(?:['+AL+']+\\s+)*[Mm][Aa][Dd][Dd][Ee][\\s:\\-–—*]*\\d+(?:\\/['+AL+']+)?[\\s*]*(?:[-–—:.][\\s*]*)*'),'');
   if(rest.trim())c.lines.push(rest)}
  else if(c)c.lines.push(l)}

const NEW=new RegExp('^(\\(\\d+\\)|\\((?:Değişik|Ek|Mülga)[^)]*\\)|['+AL+'0-9]+\\)\\s|\\d+\\s*[-–—]\\s|[IVXLCDM]+\\.\\s|[-*]\\s)');
function paras(lines){const o=[];let b='';for(let l of lines){l=l.replace(/\*\*/g,'').replace(/^#+\s*/,'').replace(/\\([^\w\s])/g,'$1').trim();
 if(!l){if(b)o.push(b);b='';continue}if(NEW.test(l)){if(b)o.push(b);b=l}else b=b?b+' '+l:l}if(b)o.push(b);return o}
const W={g:'hak[a-zçğıöşü]*|özgürlük[a-zçğıöşü]*|eşitlik[a-zçğıöşü]*|adalet|kamu yarar[a-zçğıöşü]*|adil yargılanma|savunma hakk[a-zçğıöşü]*|masumiyet karines[a-zçğıöşü]*|beraat|tahliye|lehe kanun|yargılamanın yenilenmes[a-zçğıöşü]*|yürürlük|kesinleşm[a-zçğıöşü]*|derhal|zorunlu[a-zçğıöşü]*|yükümlü[a-zçğıöşü]*|indirim[a-zçğıöşü]*|indirilir|meşru savunma|meşru müdafaa|zorunluluk hal[a-zçğıöşü]*',
r:'ceza[a-zçğıöşü]*|yaptırım[a-zçğıöşü]*|iptal[a-zçğıöşü]*|fesih|geçersiz[a-zçğıöşü]*|batıl|hükümsüz[a-zçğıöşü]*|yok hükmündedir|suç[a-zçğıöşü]*|müsadere|güvenlik tedbir[a-zçğıöşü]*|hapis|müebbet|yakalama|gözalt[a-zçğıöşü]*|tutukla[a-zçğıöşü]*|adli kontrol|redd[a-zçğıöşü]*|düş[a-zçğıöşü]*|haciz[a-zçğıöşü]*|iflas[a-zçğıöşü]*|konkordato|görevsiz[a-zçğıöşü]*|yetkisiz[a-zçğıöşü]*',
y:'iyi ?niyet[a-zçğıöşü]*|kötü ?niyet[a-zçğıöşü]*|dürüstlük kural[a-zçğıöşü]*|hakkaniyet|kusur[a-zçğıöşü]*|illiyet bağ[a-zçğıöşü]*|ispat[a-zçğıöşü]*|karine[a-zçğıöşü]*|zamanaşım[a-zçğıöşü]*|hak düşürücü[a-zçğıöşü]*|takdir[a-zçğıöşü]*|makul süre|özen[a-zçğıöşü]*|basiretli tacir|muvazaa[a-zçğıöşü]*|gabin|ikrah|kötüye kullan[a-zçğıöşü]*|ölçülülük|orantılı[a-zçğıöşü]*|açıkça',
m:'dava[a-zçğıöşü]*|delil[a-zçğıöşü]*|tanık[a-zçğıöşü]*|bilirkiş[a-zçğıöşü]*|keşif|yemin|ikrar|hüküm|itiraz[a-zçğıöşü]*|istinaf|temyiz|kanun yol[a-zçğıöşü]*|soruşturma|kovuşturma|iddianame|şüpheli|sanık|mağdur|katılan|müdafi|vekil|ifade|sorgu|takipsizlik|icra|takip|ödeme emri|şikâyet[a-zçğıöşü]*|menfi tespit|istirdat|istihkak|rehin|ipotek|tescil|tacir|velayet|vesayet|nafaka|miras[a-zçğıöşü]*|tereke|vasiyet|tebligat|tebliğ|duruşma|tensip',
t:'nitelikli hâl|nitelikli hal|ağırlaştırıcı neden|hafifletici neden|kadın[a-zçğıöşü]*|çocuk[a-zçğıöşü]*|üstsoy[a-zçğıöşü]*|altsoy[a-zçğıöşü]*|silah[a-zçğıöşü]*|gece vakti|tasarlayarak|örgüt[a-zçğıöşü]*|teşebbüs[a-zçğıöşü]*|iştirak[a-zçğıöşü]*|azmettiren|zincirleme suç|makul şüphe|kuvvetli şüphe|şikâyete bağlı|resen|kesin yetk[a-zçğıöşü]*|ihtiyati tedbir|ihtiyati haciz'};
const KW=Object.entries(W).map(([k,v])=>[new RegExp('(?<![a-zçğıöşü])(?:'+norm(v)+')(?![a-zçğıöşü])','g'),k]);
function paint(s,q,uh){const n=norm(s);if(n.length!=s.length)return esc(s);const c=[];
 const mk=(a,b,cl)=>{for(let i=a;i<b;i++)if(!c[i])c[i]=cl};
 uh.forEach(([t,cl])=>{const x=norm(t),i=n.indexOf(x);if(i>=0)mk(i,i+x.length,'u'+cl)});
 if(q){const x=norm(q);for(let i=n.indexOf(x);i>=0;i=n.indexOf(x,i+x.length))mk(i,i+x.length,'q')}
 KW.forEach(([re,cl])=>{re.lastIndex=0;let m;while((m=re.exec(n))){if(!m[0].length){re.lastIndex++;continue}mk(m.index,m.index+m[0].length,cl)}});
 let h='',i=0;while(i<s.length){let j=i+1;while(j<s.length&&c[j]==c[i])j++;const p=esc(s.slice(i,j));h+=c[i]?`<span class=${c[i]}>${p}</span>`:p;i=j}return h}
const NM='\\d+(?:\\/[a-zçğıöşü]+)?',XR=new RegExp('(?<=\\bmadde\\s+)('+NM+')|\\b('+NM+')(?=(?:\\s*(?:,|ve|ila|ile|veya)\\s*'+NM+')*(?:\\.|\\s*(?:inci|ıncı|nci|üncü|uncu))?\\s*madde)','gi');
function lk(s,q,uh,has){if(!has)return paint(s,q,uh);let o='',i=0,m;XR.lastIndex=0;while((m=XR.exec(s))){const n=m[1]||m[2],k=anahtar(n);if(k&&has(k)){o+=paint(s.slice(i,m.index),q,uh)+`<a class=x data-k="${k}">${esc(n)}</a>`;i=m.index+n.length}}return o+paint(s.slice(i),q,uh)}
function ph(p,q,uh,has){let h='';p.split(/(\((?:Ek|Değişik|Mülga|İptal|Yeniden|Başlığı)[^)]*\)|\[\^?\d+\])/).forEach((s,i)=>{
 h+=i%2?(s[0]=='['?`<sup data-f="${s.replace(/\D/g,'')}">${s.replace(/\D/g,'')}</sup>`:`<i class=n>${esc(s)}</i>`):lk(s,q,uh,has)});
 return'<p>'+h.replace(/^(\(\d+\))/,'<b class=f>$1</b>').replace(new RegExp('^(['+AL+']\\))'),'<b class=b>$1</b>')+'</p>'}
const etiket=k=>{const m=k.match(/^((?:gecici|ek|mukerrer)*)(.*)$/),on=m[1].replace(/gecici/g,'Geçici ').replace(/ek/g,'Ek ').replace(/mukerrer/g,'Mükerrer ');return on+'Madde '+m[2].toUpperCase()};
const anahtar=t=>{t=norm(t).replace(/\s/g,'').replace(/geci̇ci/g,'geçici');let m=t.match(/^(ek|e|geçici|gecici|g|mükerrer|mukerrer)[./:-]?(\d+(?:\/[a-zçğıöşü]+)?)$/);
 if(m)return({e:'ek',ek:'ek',g:'gecici','geçici':'gecici',gecici:'gecici'}[m[1]]||'mukerrer')+m[2];return/^\d+(\/[a-zçğıöşü]+)?$/.test(t)?t:null};
function aramaSonuc(a,q){const x=norm(q),o=[];for(const p of paras(a.lines))for(const s of p.split(/(?<=[.;:])\s+/))if(norm(s).includes(x))o.push(s.length>230?'… '+s.slice(Math.max(0,norm(s).indexOf(x)-90),norm(s).indexOf(x)+130)+' …':s);return o}
const MU=/yururlukten-kaldirilmis|mulga/;
const UE=x=>/(?:kitap|kisim|bap|bab|bölüm|fasil|ayirim)$/.test(norm(x).replace(/[\s:.\-–—]+$/,''));
function mergeSec(s){const g=[];let c=[];for(const p of s){if(UE(p)){if(p.trim().split(/\s+/).length==1&&c.length){const pv=c.pop();if(c.length)g.push(c.join(' '));g.push(pv+' '+p)}else{if(c.length)g.push(c.join(' '));g.push(p)}c=[]}else c.push(p)}if(c.length)g.push(c.join(' '));
 const o=[];for(const x of g){const l=o[o.length-1];if(!UE(x)&&l&&UE(l))o[o.length-1]=l+' — '+x;else o.push(x)}return o}
function fnParse(L,end){const cl=s=>s.replace(/\*\*/g,'').replace(/\\([().\[\]])/g,'$1'),cut=cl(L.slice(0,end).join('\n')).length,t=cl(L.join('\n')),br={},pa={};
 const re=/^[ \t]*(?:\[\^?(\d+)\]|\((\d+)\)):?[ \t]*(?:\r?\n[ \t]*)*([^\r\n]+(?:\r?\n(?![ \t]*(?:\[\^?\d+\]|\(\d+\)|(?:#+[ \t]*)?(?:Geçici\s+|Ek\s+|Mükerrer\s+)?Madde\s+\d+|KANUNA EK VE DEĞİŞİKLİK|\d{4}\s+SAYILI\s+KANUNA|EK VE DEĞİŞİKLİK|YÜRÜRLÜĞE GİRİŞ|[-_–—]{5,}|\+---|\|))[^\r\n]+)*)/gmi;
 let m;while((m=re.exec(t))){const b=m[3].replace(/\s+/g,' ').trim();if(b.length>5&&!/^(?:#+\s*)?(?:(?:Geçici|Ek|Mükerrer)\s+)?Madde\s+\d+/i.test(b)){if(m[1])br[m[1]]=b;else if(m.index>=cut)pa[m[2]]=b}}
 return{...pa,...br}}
function eski(md,key){const out=[];let bol='',hd=false,buf=[];const fl=()=>{if(hd&&buf.length)out.push([bol,buf.join(' ')]);buf=[]};
 for(let l of md.replace(/\r/g,'').split('\n')){l=l.replace(/\*\*/g,'').trim();if(/^\d+(-\d+)?$/.test(l))continue;
  if(/^\d+\s*[-–—.]\s*[\d\/]+.*(?:sayılı\s+Kanun|Kararı\s+ile)/i.test(l)){fl();hd=false;bol=l;continue}
  if(/^(?:[-_–—]{5,}|\d{4}\s+SAYILI\s+KANUNA\s+EK)/i.test(l)){fl();hd=false;continue}
  const k=head(l);if(k){fl();hd=k==key;if(hd)buf.push(l);continue}if(hd&&l)buf.push(l)}
 fl();return out}
//ENDCORE
const TT={};function col(o){if(Array.isArray(o))return o.forEach(col);if(o&&typeof o=='object'){if(typeof o.title=='string'&&(o.slug||o.law_number)){if(o.slug)TT[o.slug]=o.title}else for(const[k,x]of Object.entries(o)){if(x&&typeof x=='object'&&typeof x.title=='string'&&!x.slug)TT[k]=x.title;else col(x)}}}
const FD=[5237,5271,4721,6098,6100,6102,2004,2709,2577,4857,6698,6502],favs=()=>JSON.parse(localStorage.fav||'null')||FD;

 return k.replace(/^\d+-/,'').replace(/-/g,' ').toLocaleUpperCase('tr')}

 cur={f,...parse(r.md),eski:es,t:(ms.find(m=>m.k==f)||{}).title||f};return cur}
const eskiHtml=(c,k)=>{const es=c.eski.flatMap(md=>eski(md,k));return es.length?`<details class=fn open><summary><b>Yürürlükten kaldırılmış eski metinler (${es.length})</b></summary>${es.map(([b,t])=>`<p><b>${esc(b)}</b><br>${esc(t)}</p>`).join('')}</details>`:''}
function favBtn(c){const n=parseInt(c.f),b=$('#fv');if(!n){b.remove();return}const on=()=>favs().includes(n);b.textContent=on()?'★ Sık kullanılanlardan çıkar':'☆ Sık kullanılanlara ekle';b.onclick=()=>{localStorage.fav=JSON.stringify(on()?favs().filter(x=>x!=n):[...favs(),n]);favBtn(c)}}

 if(s[0]=='ayar')return ayar();if(s[0]=='l'&&s[1]){const c=await load(s[1]);if(!c)return home();return s[2]?art(c,s[2],Q):law(c,Q)}home()}

 getSelection().toString().split(/\n+/).map(x=>x.replace(/\s+/g,' ').trim()).filter(x=>x.length>2).forEach(x=>{a=a.filter(y=>!norm(y[0]).includes(norm(x))&&!norm(x).includes(norm(y[0])));if(b.dataset.c!='0')a.push([x,b.dataset.c])});

 v.innerHTML=`<div class=it><b>Açık Mevzuat deposu</b><small>PC’de: git -C &lt;klasör&gt; remote get-url origin</small><br><input id=rp placeholder="kullanici/depo" value="${esc(c.repo)}"><input id=br placeholder="dal (main)" value="${esc(c.br)}"><button class=p id=up>Güncelle</button><p id=lg class=n></p></div>
